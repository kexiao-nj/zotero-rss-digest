[project]
name = "zotero-rss-analyzer"
version = "0.1.0"
description = "Read Zotero RSS feeds, filter new items, and distill a periodic digest."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.32,<3",
    "urllib3>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zotero-rss = "zotero_rss_analyzer.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
