<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://rssdigest/content/preferences.css" type="text/css"?>
<window id="rss-digest-prefs-window"
        xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
        title="RSS Digest"
        width="580"
        height="760"
        persist="screenX screenY width height">
  <vbox id="rss-digest-prefs" flex="1">
    <label class="rss-digest-title" value="RSS Digest"/>
    <scrollbox flex="1" orient="vertical">
      <groupbox>
        <caption label="LLM API"/>
        <label value="Base URL"/>
        <textbox id="rss-digest-api-base" flex="1"/>
        <description>OpenAI-compatible endpoint. DeepSeek / OpenRouter / local vLLM all work.</description>
        <label value="API Key"/>
        <textbox id="rss-digest-api-key" type="password" flex="1"/>
        <label value="Model"/>
        <textbox id="rss-digest-model" flex="1"/>
      </groupbox>

      <groupbox>
        <caption label="Scan"/>
        <hbox align="end">
          <vbox flex="1">
            <label value="Interval (hours)"/>
            <textbox id="rss-digest-interval" type="number"/>
          </vbox>
          <vbox flex="1">
            <label value="Digest language"/>
            <menulist id="rss-digest-language">
              <menupopup>
                <menuitem value="zh" label="中文"/>
                <menuitem value="en" label="English"/>
              </menupopup>
            </menulist>
          </vbox>
        </hbox>
        <description>Original title, authors, DOI and abstract stay in the source language. Only LLM cards switch.</description>
        <label value="Save-to collection name"/>
        <textbox id="rss-digest-collection" flex="1"/>
      </groupbox>

      <groupbox>
        <caption label="Research profile"/>
        <label value="Topics (one per line)"/>
        <textbox id="rss-digest-topics" multiline="true" rows="4" flex="1"/>
        <label value="Include keywords (one per line)"/>
        <textbox id="rss-digest-include" multiline="true" rows="4" flex="1"/>
        <label value="Exclude keywords (one per line)"/>
        <textbox id="rss-digest-exclude" multiline="true" rows="3" flex="1"/>
      </groupbox>
    </scrollbox>
    <hbox class="rss-digest-actions" align="center">
      <button id="rss-digest-test-llm" label="Test LLM"/>
      <label id="rss-digest-pref-status" flex="1" crop="end"/>
    </hbox>
  </vbox>
</window>
